<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Magic Card</title>
    <style>
        /* ==========================================================================
           哈利波特風格主題變數 (霍格華茲經典配色與復古羊皮紙感)
           ========================================================================== */
        :root {
            /* 顏色系統 */
            --bg-gradient-start: #11141a;
            /* 深邃黑夜 */
            --bg-gradient-end: #07090c;
            --card-bg: #1c212d;
            /* 學院魔法黑 */
            --card-border: #d4af37;
            /* 經典霍格華茲金 */
            --card-border-glow: rgba(212, 175, 55, 0.3);
            --text-primary: #f3ebd3;
            /* 復古羊皮紙白 */
            --text-secondary: #cda250;
            /* 沉穩暗金 */
            --badge-bg: #740001;
            /* 葛來分多經典紅 */
            --badge-text: #eaeaea;
            --btn-bg: #d4af37;
            /* 魔法金按鈕 */
            --btn-text: #0b0d11;
            --btn-hover: #b89327;
            --shadow-color: rgba(0, 0, 0, 0.7);

            /* 字體與裝飾 */
            --font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
            /* 仿古英式字體 */
            --card-radius: 12px;
            --badge-radius: 4px;
            --btn-radius: 6px;
        }

        /* 重設與背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        /* 記憶卡片主體 */
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--card-radius);
            box-shadow: 0 10px 30px var(--shadow-color), 0 0 15px var(--card-border-glow);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px var(--shadow-color), 0 0 25px var(--card-border);
        }

        /* 卡片圖片區域 */
        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 2px solid var(--card-border);
            filter: sepia(0.2) contrast(1.1);
            /* 增加一點復古膠卷感 */
        }

        /* 卡片內容區域 */
        .card-content {
            padding: 24px;
        }

        /* 標籤 (例如：Gryffindor) */
        .card-badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 6px 12px;
            border-radius: var(--badge-radius);
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
        }

        /* 標題 (例如：Harry Potter) */
        .card-title {
            color: var(--card-border);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px var(--shadow-color);
        }

        /* 副標題 (例如：The Boy Who Lived) */
        .card-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 16px;
            font-style: italic;
        }

        /* 描述文字 */
        .card-description {
            color: var(--text-primary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* 功能按鈕 */
        .card-button {
            display: block;
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            text-align: center;
            padding: 12px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: var(--btn-radius);
            transition: background-color 0.2s ease, transform 0.1s ease;
            border: none;
            cursor: pointer;
            font-family: var(--font-family);
            text-transform: uppercase;
        }

        .card-button:hover {
            background-color: var(--btn-hover);
        }

        .card-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <!-- 這裡放您原本的 HTML 結構，樣式已完美對接 -->
    <div class="card">
        <img src="https://unsplash.com" alt="Hogwarts Castle" class="card-image">
        <div class="card-content">
            <span class="card-badge">Gryffindor</span>
            <h2 class="card-title">Harry Potter</h2>
            <h3 class="card-subtitle">The Boy Who Lived</h3>
            <p class="card-description">A young wizard who discovers his magical heritage on his eleventh birthday, when
                he receives a letter of acceptance to Hogwarts School of Witchcraft and Wizardry.</p>
            <a href="#" class="card-button">Cast Spell</a>
        </div>
    </div>

</body>

</html>
